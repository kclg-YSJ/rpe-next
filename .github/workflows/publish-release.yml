name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Build release packages run ID
        type: string
        required: true
      source_commit:
        description: Exact source commit used by every package
        type: string
        required: true
      prerelease:
        description: Mark this release as a prerelease
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.build_run }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify build provenance
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > build-run.json
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("build-run.json")); if(r.name!=="Build release packages" || r.conclusion!=="success" || r.head_sha!==process.env.SOURCE_COMMIT || !/^[a-f0-9]{40}$/.test(r.head_sha)) throw Error("Build source or result mismatch");'
      - name: Read release version
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const {version}=JSON.parse(fs.readFileSync("package.json")); if(!/^\d+\.\d+\.\d+$/.test(version))throw Error("Invalid release version"); if(!fs.existsSync(`.github/release-notes/v${version}.md`))throw Error("Missing release notes"); fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${version}\nRELEASE_TAG=v${version}\n`);'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Normalize artifact layout
        run: |
          if [ -d "release-assets/$RELEASE_TAG" ]; then
            mv "release-assets/$RELEASE_TAG/"* release-assets/
            rmdir "release-assets/$RELEASE_TAG"
          fi
      - name: Verify all packages and generate checksums
        run: node tools/verify-release-assets.mjs release-assets "$SOURCE_COMMIT"
      - name: Create and verify release tag
        run: |
          tag_count="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" --jq "map(select(.ref == \"refs/tags/$RELEASE_TAG\")) | length")"
          if [ "$tag_count" = 0 ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$SOURCE_COMMIT"
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_COMMIT"
      - name: Create draft, upload and publish
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > existing-release.json; then
            node --input-type=module -e 'import fs from "node:fs"; if(!JSON.parse(fs.readFileSync("existing-release.json")).isDraft)throw Error("Release is already published");'
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --draft --prerelease="$RELEASE_PRERELEASE" --title "rpe-next $RELEASE_VERSION" --notes-file ".github/release-notes/$RELEASE_TAG.md"
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_COMMIT"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "rpe-next $RELEASE_VERSION" --notes-file ".github/release-notes/$RELEASE_TAG.md"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber release-assets/*.zip release-assets/*.dmg release-assets/*.tar.xz release-assets/SHA256SUMS.txt
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\")" > release-result.json
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("release-result.json")), v=JSON.parse(fs.readFileSync("release-assets/verified-assets.json")); if(!r.draft || r.assets.length!==8) throw Error("Incomplete draft"); for(const a of v.assets){const b=r.assets.find(x=>x.name===a.file); if(!b || b.size!==a.bytes || b.digest && b.digest!=="sha256:"+a.sha256)throw Error("Uploaded asset mismatch: "+a.file);}'
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$RELEASE_PRERELEASE"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets
